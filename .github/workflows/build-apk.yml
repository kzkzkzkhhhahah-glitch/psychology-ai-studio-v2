name: Build Psychology AI Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract v2 project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q PsychologyAIStudio-Clean-v2.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/PsychologyAIStudioClean
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: psychology-ai-studio-v2-debug-apk
          path: extracted/PsychologyAIStudioClean/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
